name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、後続を待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ローカル開発と同じ系統に合わせる。依存パッケージはないので install は不要。
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Run tests
        run: npm test

      # base_url を得るためビルドより先に実行する。
      - uses: actions/configure-pages@v6
        id: pages

      - name: Build
        # worker が実行時に行う __SITE_ORIGIN__ の置換を、静的配信ではビルド時に行う。
        # 独自ドメインを設定した場合もここに反映される。
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
